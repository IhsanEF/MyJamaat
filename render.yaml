# Free web compute with externally persisted Turso storage. Secrets are entered
# privately in Render. Do not enable paid compute, disks, or usage overages.
services:
  - type: web
    name: my-jamaat
    runtime: node
    repo: https://github.com/IhsanEF/MyJamaat
    branch: main
    region: oregon
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm run install:ci && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_SIGN_IN_EMAILS
        sync: false
