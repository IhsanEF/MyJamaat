# Applying this Blueprint creates paid compute and storage. Review the charges
# in Render before creating it. This file itself does not create a service.
services:
  - type: web
    name: my-jamaat
    runtime: node
    repo: https://github.com/IhsanEF/MyJamaat
    branch: main
    region: oregon
    plan: starter
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm run install:ci && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    disk:
      name: my-jamaat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SQLITE_PATH
        value: /var/data/my-jamaat.sqlite
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_SIGN_IN_EMAILS
        sync: false
